<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI Study Buddy: lessons, quizzes, and a local study assistant." />
  <title>AI Study Buddy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-6A8 8 0 1 1 21 12z"/></symbol>
  </svg>

  <div class="app">
    <nav class="nav" aria-label="Main">
      <div class="brand"><span class="logo" aria-hidden="true">✦</span><span>AI Study Buddy</span></div>
      <button class="nav-btn" data-view="dashboard"><svg aria-hidden="true"><use href="#i-home"/></svg><span>Dashboard</span></button>
      <button class="nav-btn" data-view="study"><svg aria-hidden="true"><use href="#i-book"/></svg><span>Study</span></button>
      <button class="nav-btn" data-view="quiz"><svg aria-hidden="true"><use href="#i-check"/></svg><span>Quiz</span></button>
      <button class="nav-btn" data-view="progress"><svg aria-hidden="true"><use href="#i-chart"/></svg><span>Progress</span></button>
      <button class="nav-btn" data-view="settings"><svg aria-hidden="true"><use href="#i-gear"/></svg><span>Settings</span></button>
      <div class="side-level" id="side-level"></div>
    </nav>

    <main class="main">
      <section id="view-dashboard" aria-label="Dashboard"></section>
      <section id="view-study" aria-label="Study room" hidden></section>
      <section id="view-quiz" aria-label="Quiz" hidden></section>
      <section id="view-progress" aria-label="Progress" hidden></section>
      <section id="view-settings" aria-label="Settings" hidden></section>
    </main>

    <aside class="chat" id="chat" aria-label="Study assistant">
      <header class="chat-head">
        <div><strong>Study assistant</strong><span class="muted small block">Local demo, no AI model</span></div>
        <button class="btn" id="chat-clear" type="button">Clear chat</button>
      </header>
      <div class="chat-log" id="chat-log" role="log" aria-live="polite"></div>
      <div class="chips" id="chat-suggestions"></div>
      <form class="chat-form" id="chat-form">
        <label for="chat-input" class="sr-only">Ask a question</label>
        <input id="chat-input" type="text" placeholder="Ask a question" autocomplete="off" />
        <button class="btn primary" type="submit">Send</button>
      </form>
    </aside>
  </div>

  <button class="fab" id="chat-toggle" type="button" aria-label="Toggle study assistant" aria-expanded="false" aria-controls="chat">
    <svg aria-hidden="true"><use href="#i-chat"/></svg>
  </button>

  <dialog id="reset-dialog" aria-labelledby="reset-title">
    <h2 id="reset-title">Reset all progress?</h2>
    <p class="muted">This deletes your XP, lessons, quiz scores, and settings. It cannot be undone.</p>
    <div class="row">
      <button class="btn" id="reset-cancel" type="button">Cancel</button>
      <button class="btn danger" id="reset-confirm" type="button">Yes, reset</button>
    </div>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
